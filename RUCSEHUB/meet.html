<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUCSEHUB • Virtual Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --glass-bg: rgba(255,255,255,0.15); --glass-border: rgba(255,255,255,0.2); --shadow: 0 8px 32px rgba(0,0,0,0.15); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; height:100vh; overflow:hidden; background:linear-gradient(135deg,#1e3a8a 0%,#0f172a 70%); color:white; display:flex; flex-direction:column; }
    .appbar { padding:16px 24px; backdrop-filter:blur(20px); background:var(--glass-bg); border-bottom:1px solid var(--glass-border); box-shadow:var(--shadow); display:flex; justify-content:space-between; align-items:center; z-index:1000; }
    .logo { font-size:26px; font-weight:800; background:linear-gradient(90deg,#60a5fa,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    .meeting-info { display:flex; align-items:center; gap:20px; font-weight:600; }
    .secure-badge { background:rgba(34,197,94,0.3); padding:6px 14px; border-radius:50px; font-size:13px; border:1px solid rgba(34,197,94,0.5); }
    .room-code { background:rgba(255,255,255,0.15); padding:10px 18px; border-radius:12px; font-family:'JetBrains Mono',monospace; font-weight:700; letter-spacing:1px; border:1px solid rgba(255,255,255,0.2); }
    .loader-screen { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:rgba(15,23,42,0.6); backdrop-filter:blur(12px); }
    .spinner { width:72px; height:72px; border:5px solid rgba(255,255,255,0.2); border-top:5px solid #60a5fa; border-radius:50%; animation:spin 1.2s cubic-bezier(0.4,0,0.2,1) infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-title { font-size:28px; font-weight:700; background:linear-gradient(90deg,#93c5fd,#ddd6fe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    #jitsi-container { flex:1; position:relative; }
    .jitsi-watermark, .watermark { display:none !important; }
  </style>
</head>
<body>

  <header class="appbar">
    <div class="logo">RUCSEHUB</div>
    <div class="meeting-info">
      <div class="secure-badge">End-to-end encrypted</div>
      <div class="room-code">RUCSEHUBMainRoom</div>
    </div>
  </header>

  <div id="jitsi-container">
    <div class="loader-screen">
      <div class="spinner"></div>
      <div class="loading-title" id="joiningText">Joining...</div>
    </div>
  </div>

  <script src="https://jitsi.riot.im/external_api.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(location.search);
      const name = decodeURIComponent(params.get("name") || "Student");
      const id = decodeURIComponent(params.get("id") || "");
      const fullName = id ? `${name} (${id})` : name;

      document.getElementById("joiningText").textContent = `${name} is joining...`;

      const api = new JitsiMeetExternalAPI("jitsi.riot.im", {
        roomName: "RUCSEHUBMainRoom",
        parentNode: document.getElementById("jitsi-container"),
        userInfo: { displayName: fullName },
        configOverwrite: { 
          prejoinPageEnabled: false, 
          disableDeepLinking: true,
          startWithAudioMuted: false,
          startWithVideoMuted: false
        },
        interfaceConfigOverwrite: {
          SHOW_JITSI_WATERMARK: false,
          SHOW_BRAND_WATERMARK: false,
          SHOW_POWERED_BY: false
        },
        onload: () => {
          document.querySelector(".loader-screen").style.opacity = "0";
          setTimeout(() => document.querySelector(".loader-screen").style.display = "none", 500);
        }
      });

      api.addEventListener("videoConferenceJoined", () => {
        api.executeCommand('displayName', fullName);
      });

      api.addEventListener("readyToClose", () => {
        window.close() || (window.location.href = "https://rucsehubapp.netlify.app");
      });
    });
  </script>
</body>
</html>
