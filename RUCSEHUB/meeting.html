<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUCSEHUB Meet - Powered by RUCSEHUB Mobile App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Jitsi External API -->
    <script src="https://8x8.vc/vpaas-magic-cookie-c6f623b736374f419f0abea7115f92d5/external_api.js"></script>

    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #f0f2f5;
        font-family: "Google Sans", Arial, sans-serif;
      }

      .navbar {
        background-color: #1a73e8 !important;
      }

      .navbar-brand {
        font-weight: 600;
        font-size: 1.4rem;
        display: flex;
        align-items: center;
      }

      .navbar-brand img {
        height: 36px;
        margin-right: 10px;
      }

      #jaas-container {
        width: 100%;
        height: calc(100vh - 100px);
        background: #000;
        display: none; /* hidden until form submitted */
        position: relative;
      }

      #user-form {
        height: calc(100vh - 100px);
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f2f5;
      }

      #user-form .card {
        padding: 30px;
        width: 90%;
        max-width: 700px;
        text-align: center;
      }

      #user-form img {
        width: 120px;
        margin-bottom: 20px;
      }

      .form-control-lg {
        font-size: 1.2rem;
        padding: 15px 12px;
      }

      .btn-lg {
        padding: 12px 0;
        font-size: 1.2rem;
      }

      footer {
        text-align: center;
        background: #f8f9fa;
        padding: 8px 0;
        font-size: 14px;
        color: #666;
      }

      footer img {
        height: 20px;
        vertical-align: middle;
        margin-right: 5px;
      }

      /* Icon Buttons */
      .meeting-btn {
        position: fixed;
        top: 15px;
        z-index: 9999;
        border-radius: 50%;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }

      #leaveBtn {
        right: 15px;
        background-color: #f8f9fa;
        color: #1a73e8;
      }

      #endBtn {
        right: 75px;
        background-color: #dc3545;
        color: white;
      }

      #leaveBtn:hover {
        background-color: #e2e6ea;
      }

      #endBtn:hover {
        background-color: #c82333;
      }

      @media (max-width: 768px) {
        .navbar-brand {
          font-size: 1.1rem;
        }

        footer {
          font-size: 12px;
        }

        #user-form .card {
          padding: 20px;
        }

        #user-form img {
          width: 100px;
        }

        #endBtn {
          right: 70px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-3">
      <a class="navbar-brand text-white" href="#">
        <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo" />
        RUCSEHUB Meet
      </a>
    </nav>

    <!-- User Form -->
    <div id="user-form">
      <div class="card shadow">
        <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo" />
        <h5 class="card-title mb-4">Enter Your Details</h5>
        <form id="join-form">
          <div class="mb-3">
            <input
              type="text"
              class="form-control form-control-lg"
              id="user-name"
              placeholder="Enter your Name"
              required
            />
          </div>
          <div class="mb-3">
            <input
              type="text"
              class="form-control form-control-lg"
              id="student-id"
              placeholder="Enter your Student ID"
              required
            />
          </div>
          <button type="submit" class="btn btn-primary btn-lg w-100">
            Join Meeting
          </button>
        </form>
      </div>
    </div>

    <!-- Jitsi Meeting Area -->
    <div id="jaas-container"></div>

    <!-- Footer -->
    <footer>
      <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo">
      © 2025 RUCSEHUB | Powered by <b>RUCSEHUB Mobile App</b> · Made with 💙
      for CSE Students
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Jitsi Integration -->
    <script>
      document.getElementById("join-form").addEventListener("submit", (e) => {
        e.preventDefault();

        const name = document.getElementById("user-name").value.trim();
        const studentId = document.getElementById("student-id").value.trim();

        if (!name || !studentId) {
          alert("Please enter both Name and Student ID.");
          return;
        }

        // Hide form and show Jitsi container
        document.getElementById("user-form").style.display = "none";
        const jaasContainer = document.getElementById("jaas-container");
        jaasContainer.style.display = "block";

        const domain = "8x8.vc";
        const options = {
          roomName:
            "vpaas-magic-cookie-c6f623b736374f419f0abea7115f92d5/RUCSEHUBMainRoom",
          parentNode: jaasContainer,
          width: "100%",
          height: "100%",
          userInfo: {
            displayName: name + " (" + studentId + ")",
          },
          interfaceConfigOverwrite: {
            TOOLBAR_BUTTONS: [
              "microphone",
              "camera",
              "desktop",
              "fullscreen",
              "chat",
              "raisehand",
              "tileview",
              "hangup",
            ],
            SHOW_JITSI_WATERMARK: false,
            SHOW_BRAND_WATERMARK: false,
            SHOW_WATERMARK_FOR_GUESTS: false,
            DEFAULT_REMOTE_DISPLAY_NAME: "Guest",
            DEFAULT_LOCAL_DISPLAY_NAME: name,
          },
          configOverwrite: {
            prejoinPageEnabled: true,
            disableDeepLinking: true,
          },
        };

        const api = new JitsiMeetExternalAPI(domain, options);

        // Create icon buttons
        const leaveBtn = document.createElement("button");
        leaveBtn.id = "leaveBtn";
        leaveBtn.className = "meeting-btn";
        leaveBtn.innerHTML = '<i class="bi bi-box-arrow-right fs-4"></i>';
        leaveBtn.title = "Leave Meeting";

        const endBtn = document.createElement("button");
        endBtn.id = "endBtn";
        endBtn.className = "meeting-btn";
        endBtn.innerHTML = '<i class="bi bi-power fs-4"></i>';
        endBtn.title = "End Meeting";

        document.body.appendChild(endBtn);
        document.body.appendChild(leaveBtn);

        // Leave Meeting
        leaveBtn.addEventListener("click", () => {
          api.executeCommand("hangup");
          window.location.href = "https://rucsehubapp.netlify.app/";
        });

        // End Meeting
        endBtn.addEventListener("click", () => {
          api.executeCommand("hangup");
          window.location.href = "https://rucsehubapp.netlify.app/";
        });

        // Resize fix
        window.addEventListener("resize", () => {
          api.resizeLargeVideo();
        });
      });
    </script>
  </body>
</html>
