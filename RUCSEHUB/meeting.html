<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUCSEHUB • Virtual Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --accent: #8b5cf6;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.15);
      --border: rgba(255, 255, 255, 0.18);
      --text: #e2e8f0;
      --bg-start: #0f172a;
      --bg-end: #1e293b;
      --shimmer: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-start), var(--bg-end));
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      padding: 1rem 1.5rem;
      backdrop-filter: blur(20px);
      background: var(--glass);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 2rem;
      font-weight: 900;
      background: linear-gradient(90deg, #60a5fa, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .home-btn {
      background: transparent;
      border: 1.5px solid var(--border);
      color: white;
      padding: 0.6rem 1.2rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .home-btn:hover { background: rgba(255,255,255,0.1); }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      gap: 2.5rem;
    }

    .container {
      width: 100%;
      max-width: 460px;
      display: grid;
      gap: 2rem;
    }

    @media (min-width: 768px) {
      main { flex-direction: row; flex-wrap: wrap; justify-content: center; }
      .container { grid-template-columns: 1fr 1fr; max-width: 1000px; }
    }

    .box {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      transition: transform 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .box:hover { transform: translateY(-8px); }

    /* Permanent Running Shimmer */
    .shimmer {
      position: absolute;
      top: 0;
      left: -150%;
      height: 100%;
      width: 60%;
      background: var(--shimmer);
      animation: shimmer 3.5s linear infinite;
      transform: skewX(-20deg);
      pointer-events: none;
      z-index: 1;
    }

    @keyframes shimmer {
      0%   { left: -150%; }
      100% { left: 150%; }
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #93c5fd, #ddd6fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .subtitle {
      font-size: 0.95rem;
      opacity: 0.8;
      margin-bottom: 1.5rem;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    form, .msg, .link-box, button, .success {
      position: relative;
      z-index: 2;
    }

    /* Rest of your styles (unchanged) */
    form { display: grid; gap: 1rem; }
    input {
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: white;
      font-size: 1rem;
      transition: all 0.3s ease;
    }
    input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(59,130,246,0.2);
    }
    input::placeholder { color: rgba(255,255,255,0.5); }

    button {
      padding: 1rem;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 0.5rem;
    }
    button[type="submit"] { background: var(--primary); border: none; color: white; }
    button[type="submit"]:hover { background: var(--primary-dark); transform: translateY(-2px); }

    .copy-btn, #joinAfterCreate { background: #10b981; }
    .copy-btn:hover, #joinAfterCreate:hover { background: #059669; }

    .msg { min-height: 28px; font-weight: 600; text-align: center; font-size: 0.95rem; }
    .link-box {
      background: var(--glass-strong);
      padding: 1rem;
      border-radius: 14px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      margin: 1rem 0;
      border: 1px dashed var(--border);
    }
    .success, #autoJoinMsg { color: #34d399; font-weight: 600; text-align: center; font-size: 0.95rem; }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      opacity: 0.7;
      background: rgba(0,0,0,0.2);
    }

    #meetingPage { display: none; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; }
    #jitsi-container { width: 100%; height: 100%; }

    .loader-screen {
      position: absolute;
      inset: 0;
      background: rgba(15,23,42,0.98);
      backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 999;
      transition: opacity 0.8s ease;
    }

    .spinner {
      width: 80px; height: 80px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #60a5fa;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(90deg, #93c5fd, #ddd6fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    @media (max-width: 480px) {
      .logo { font-size: 1.7rem; }
      header { padding: 1rem; }
      .box { padding: 2rem 1.5rem; border-radius: 20px; }
      h1 { font-size: 1.8rem; }
      input, button { padding: 0.9rem 1rem; font-size: 0.95rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">RUCSEHUB Meet</div>
    <button class="home-btn" onclick="window.open('https://rucsehub.netlify.app','_blank')">Home</button>
  </header>

  <main id="homePage">
    <div class="container">

      <!-- Create Room -->
      <div class="box">
        <div class="shimmer"></div>
        <h1>Create New Room</h1>
        <p class="subtitle">Start a secure class instantly</p>

        <form id="createForm">
          <input type="text" name="name" placeholder="Your Full Name" required>
          <input type="text" name="id" placeholder="Student ID (221076XXXX)" maxlength="10" required>
          <input type="text" name="room" placeholder="Room name → e.g., Math2025" required>
          <div class="msg" id="createMsg"></div>
          <button type="submit">Create Room</button>
        </form>

        <div id="createdLink" class="link-box" style="display:none;"></div>
        <button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyLink()">Copy Secure Link</button>
        <button id="joinAfterCreate" style="display:none;">Join Room Now</button>
        <div class="success" id="createSuccess" style="display:none;">Room created! Link is encrypted</div>
      </div>

      <!-- Join Room -->
      <div class="box">
        <div class="shimmer"></div>
        <h1>Join Meeting</h1>
        <p class="subtitle">Enter your details to join</p>

        <form id="joinForm">
          <input type="text" name="name" placeholder="Your Full Name" required>
          <input type="text" name="id" placeholder="Student ID (221076XXXX)" maxlength="10" required>
          <input type="hidden" id="hiddenRoomInput" value="">
          <div class="msg" id="joinMsg"></div>
          <button type="submit">Join Meeting</button>
        </form>
        <div class="success" id="autoJoinMsg" style="display:none;">Auto-joining in 2s...</div>
      </div>

    </div>
  </main>

  <footer>© 2025 RUCSEHUB • CSE, University of Rajshahi</footer>

  <div id="meetingPage">
    <div id="jitsi-container">
      <div class="loader-screen">
        <div class="spinner"></div>
        <div class="loading-title" id="joiningText">Joining room...</div>
      </div>
    </div>
  </div>

  <!-- All your original JavaScript (100% unchanged) -->
  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycby--FbH_De9SLlwwrE__4cjixi7M3pFNAR82n4Hu3ZqIGX4Vj2IHFhzgw2l66zCButD/exec";
    const HOME_URL = "https://rucsehub.netlify.app";
    const PREFIX = "RUCSEHUB";

    function encryptRoom(room) { return btoa(room + "x9k2m").split("").reverse().join(""); }
    function decryptRoom(hash) {
      try { return atob(hash.split("").reverse().join("")).replace(/x9k2m$/, ""); }
      catch { return null; }
    }

    function getRealRoomName(displayName) { return PREFIX + displayName.replace(/\s+/g, ''); }

    function saveUser(name, id, displayRoom) {
      localStorage.setItem("rucsehub_user", JSON.stringify({name, id, displayRoom, timestamp: Date.now()}));
    }
    function getUser() {
      const data = localStorage.getItem("rucsehub_user");
      return data ? JSON.parse(data) : null;
    }

    function validate(id) {
      if (id.length !== 10) return {ok:false, m:"ID must be 10 digits"};
      if (!/^\d+$/.test(id)) return {ok:false, m:"Only numbers"};
      if (id[5]!=='7' || id[6]!=='6') return {ok:false, m:"Only RU CSE students allowed"};
      return {ok:true, m:"Welcome CSE Family!"};
    }

    const urlParams = new URLSearchParams(location.search);
    const encrypted = urlParams.get("r");
    let currentDisplayRoom = "";

    if (encrypted) {
      currentDisplayRoom = decryptRoom(encrypted) || "";
      if (currentDisplayRoom) {
        document.getElementById("hiddenRoomInput").value = currentDisplayRoom;
        const saved = getUser();
        if (saved && saved.displayRoom === currentDisplayRoom) {
          document.getElementById("autoJoinMsg").style.display = "block";
          setTimeout(() => {
            const form = document.getElementById("joinForm");
            form.name.value = saved.name;
            form.id.value = saved.id;
            joinRoom(saved.name, saved.id, currentDisplayRoom);
          }, 2000);
        }
      }
    }

    document.querySelectorAll('input[name="id"]').forEach(inp => {
      inp.addEventListener('input', e => {
        const msg = e.target.closest('form').querySelector('.msg');
        if (e.target.value.length === 10) {
          const v = validate(e.target.value);
          msg.textContent = v.m;
          msg.style.color = v.ok ? "#34d399" : "#f87171";
        } else msg.textContent = "";
      });
    });

    document.getElementById("createForm").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const id = e.target.id.value.trim();
      const displayRoom = e.target.room.value.trim().replace(/\s+/g, '');

      if (!name || !id || !displayRoom) return alert("Fill all fields");
      const v = validate(id);
      if (!v.ok) return alert(v.m);

      const encryptedHash = encryptRoom(displayRoom);
      const shareLink = `${location.origin}${location.pathname}?r=${encryptedHash}`;

      document.getElementById("createdLink").textContent = shareLink;
      document.getElementById("createdLink").style.display = "block";
      document.getElementById("copyBtn").style.display = "inline-block";
      document.getElementById("joinAfterCreate").style.display = "inline-block";
      document.getElementById("createSuccess").style.display = "block";

      saveUser(name, id, displayRoom);
    };

    document.getElementById("joinAfterCreate").onclick = () => {
      const displayRoom = document.querySelector('#createForm input[name="room"]').value.trim().replace(/\s+/g, '');
      const name = document.querySelector('#createForm input[name="name"]').value.trim();
      const id = document.querySelector('#createForm input[name="id"]').value.trim();
      joinRoom(name, id, displayRoom);
    };

    document.getElementById("joinForm").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const id = e.target.id.value.trim();
      const displayRoom = document.getElementById("hiddenRoomInput").value;

      if (!displayRoom) { alert("Invalid or missing room link!"); return; }

      const v = validate(id);
      if (!v.ok) return alert(v.m);

      saveUser(name, id, displayRoom);
      joinRoom(name, id, displayRoom);
    };

    function joinRoom(name, id, displayRoom) {
      const realRoom = getRealRoomName(displayRoom);

      fetch(scriptURL, { method:'POST', body:JSON.stringify({name, id, room: realRoom}) })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          document.getElementById("joiningText").textContent = `${name} is joining...`;
          document.getElementById("homePage").style.display = "none";
          document.querySelector("header").style.display = "none";
          document.querySelector("footer").style.display = "none";
          document.getElementById("meetingPage").style.display = "block";

          const fullName = `${name} (${id})`;
          const api = new JitsiMeetExternalAPI("jitsi.riot.im", {
            roomName: realRoom,
            parentNode: document.getElementById("jitsi-container"),
            userInfo: { displayName: fullName },
            configOverwrite: { prejoinPageEnabled: false },
            interfaceConfigOverwrite: {
              SHOW_JITSI_WATERMARK: false,
              SHOW_BRAND_WATERMARK: false,
              SHOW_POWERED_BY: false
            },
            onload: () => {
              setTimeout(() => {
                document.querySelector(".loader-screen").style.opacity = "0";
                setTimeout(() => document.querySelector(".loader-screen").style.display = "none", 600);
              }, 800);
            }
          });

          api.addEventListener("readyToClose", () => {
            window.location.href = HOME_URL;
          });
        }
      })
      .catch(() => alert("Network error. Try again."));
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById("createdLink").textContent);
      document.getElementById("copyBtn").textContent = "Copied!";
      setTimeout(() => document.getElementById("copyBtn").textContent = "Copy Secure Link", 2000);
    }
  </script>

  <script src="https://jitsi.riot.im/external_api.js"></script>
</body>
</html>
