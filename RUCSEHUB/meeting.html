<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUCSEHUB • Join Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root { --primary: #3b82f6; --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.2); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; height:100vh; background:linear-gradient(135deg,#0f172a,#1e293b); color:white; display:flex; flex-direction:column; }
    header { padding:16px 24px; backdrop-filter:blur(20px); background:var(--glass); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:28px; font-weight:800; background:linear-gradient(90deg,#60a5fa,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
    .box { background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:20px; padding:40px; max-width:480px; width:100%; text-align:center; }
    h1 { font-size:32px; background:linear-gradient(90deg,#93c5fd,#ddd6fe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    input { width:100%; padding:14px; margin:12px 0; border:1px solid var(--border); background:rgba(255,255,255,0.05); border-radius:12px; color:white; font-size:16px; }
    #msg { margin:10px 0; min-height:24px; font-weight:600; }
    button { width:100%; padding:14px; background:var(--primary); border:none; border-radius:12px; color:white; font-size:17px; font-weight:600; cursor:pointer; margin-top:10px; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    footer { text-align:center; padding:20px; opacity:0.7; font-size:14px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">RUCSEHUB</div>
    <div>
      <button onclick="window.open('https://rucsehubapp.netlify.app','_blank')" style="background:none;border:1px solid var(--border);padding:10px 16px;border-radius:12px;">Home</button>
    </div>
  </header>

  <main>
    <div class="box">
      <h1>RUCSEHUB Meet</h1>
      <p>Virtual Classroom – Only for RU CSE Students</p>
      <form id="form">
        <input type="text" name="name" placeholder="Your Full Name" required>
        <input type="text" name="id" placeholder="Student ID (221076XXXX)" maxlength="10" required>
        <div id="msg"></div>
        <button type="submit" id="btn">Join Meeting</button>
      </form>
    </div>
  </main>
  <footer>© 2025 RUCSEHUB • CSE, University of Rajshahi</footer>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycby--FbH_De9SLlwwrE__4cjixi7M3pFNAR82n4Hu3ZqIGX4Vj2IHFhzgw2l66zCButD/exec";

    function validate(id) {
      if (id.length !== 10) return {ok:false, m:"ID must be 10 digits"};
      if (!/^\d+$/.test(id)) return {ok:false, m:"Only numbers"};
      if (id[5]!=='7' || id[6]!=='6') return {ok:false, m:"Only RU CSE students allowed"};
      return {ok:true, m:"Welcome CSE Family!"};
    }

    document.querySelector('input[name="id"]').addEventListener('input', e => {
      const msg = document.getElementById('msg');
      if(e.target.value) {
        const v = validate(e.target.value);
        msg.textContent = v.m;
        msg.style.color = v.ok ? "#34d399" : "#f87171";
      } else msg.textContent="";
    });

    document.getElementById('form').onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const id = e.target.id.value.trim();
      if(name.length<2) return alert("Enter valid name");
      const v = validate(id);
      if(!v.ok) return alert(v.m);

      document.getElementById('btn').textContent = "Saving...";
      document.getElementById('btn').disabled = true;

      fetch(scriptURL, { method:'POST', body:JSON.stringify({name,id}) })
      .then(r=>r.json())
      .then(res=>{
        if(res.status==="success") {
          // রিডাইরেক্ট + নাম+আইডি পাস
          const encodedName = encodeURIComponent(name);
          const encodedId = encodeURIComponent(id);
          window.location.href = `meet.html?name=${encodedName}&id=${encodedId}`;
        } else throw new Error();
      })
      .catch(()=> {
        alert("Network error. Try again.");
        document.getElementById('btn').textContent = "Join Meeting";
        document.getElementById('btn').disabled = false;
      });
    };
  </script>
</body>
</html>
