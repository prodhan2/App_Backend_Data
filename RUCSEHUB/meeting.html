<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUCSEHUB • Virtual Classroom</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #3b82f6; --glass: rgba(255,255,255,0.1); --border: rgba(255,255,255,0.2); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Inter',sans-serif; height:100vh; background:linear-gradient(135deg,#0f172a,#1e293b); color:white; display:flex; flex-direction:column; overflow:hidden; }
    header { padding:16px 24px; backdrop-filter:blur(20px); background:var(--glass); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .logo { font-size:28px; font-weight:800; background:linear-gradient(90deg,#60a5fa,#c084fc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
    main { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; gap:40px; flex-wrap:wrap; }
    .box { background:var(--glass); backdrop-filter:blur(16px); border:1px solid var(--border); border-radius:20px; padding:40px; width:100%; max-width:480px; text-align:center; }
    h1 { font-size:32px; background:linear-gradient(90deg,#93c5fd,#ddd6fe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:8px; }
    input, button { width:100%; padding:14px; margin:12px 0; border-radius:12px; font-size:16px; }
    input { border:1px solid var(--border); background:rgba(255,255,255,0.05); color:white; }
    button { background:var(--primary); border:none; color:white; font-weight:600; cursor:pointer; }
    button:disabled { opacity:0.6; cursor:not-allowed; }
    .msg { min-height:24px; font-weight:600; margin:10px 0; }
    .link-box { background:rgba(255,255,255,0.1); padding:16px; border-radius:12px; word-break:break-all; margin:15px 0; font-family:monospace; font-size:15px; }
    .copy-btn { background:#10b981; padding:10px; font-size:14px; margin-top:8px; }
    .success { color:#34d399; font-size:14px; margin-top:10px; }
    footer { text-align:center; padding:20px; opacity:0.7; font-size:14px; }

    #meetingPage { display:none; height:100vh; background:#0f172a; }
    #jitsi-container { width:100%; height:100%; }
    .loader-screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:32px; background:rgba(15,23,42,0.9); backdrop-filter:blur(12px); z-index:999; transition:opacity 0.6s; }
    .spinner { width:72px; height:72px; border:5px solid rgba(255,255,255,0.2); border-top:5px solid #60a5fa; border-radius:50%; animation:spin 1.2s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .loading-title { font-size:28px; font-weight:700; background:linear-gradient(90deg,#93c5fd,#ddd6fe); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  </style>
</head>
<body>

  <header>
    <div class="logo">RUCSEHUB</div>
    <div>
      <button onclick="window.open('https://rucsehub.netlify.app','_blank')" 
              style="background:none;border:1px solid var(--border);padding:10px 16px;border-radius:12px;">
        Home
      </button>
    </div>
  </header>

  <main id="homePage">
    <!-- Create Room -->
    <div class="box">
      <h1>Create New Room</h1>
  
      <form id="createForm">
        <input type="text" name="name" placeholder="Your Full Name" required>
        <input type="text" name="id" placeholder="Student ID (221076XXXX)" maxlength="10" required>
        <input type="text" name="room" placeholder="Room name → e.g., Math2025" required>
        <div class="msg" id="createMsg"></div>
        <button type="submit">Create Room</button>
      </form>
      <div id="createdLink" class="link-box" style="display:none;"></div>
      <button class="copy-btn" id="copyBtn" style="display:none;" onclick="copyLink()">Copy Secure Link</button>
      <button id="joinAfterCreate" style="display:none; margin-top:10px;">Join Room Now</button>
      <div class="success" id="createSuccess" style="display:none;">Room created! Link is encrypted</div>
    </div>

    <!-- Join Room – Room Field Hidden -->
    <div class="box">
      <h1>Join Meeting</h1>
      <p>Enter your details to join</p>
      <form id="joinForm">
        <input type="text" name="name" placeholder="Your Full Name" required>
        <input type="text" name="id" placeholder="Student ID (221076XXXX)" maxlength="10" required>
        <!-- Hidden room field -->
        <input type="hidden" id="hiddenRoomInput" value="">
        <div class="msg" id="joinMsg"></div>
        <button type="submit">Join Meeting</button>
      </form>
      <div class="success" id="autoJoinMsg" style="display:none;">Auto-joining in 2s...</div>
    </div>
  </main>

  <footer>© 2025 RUCSEHUB • CSE, University of Rajshahi</footer>

  <div id="meetingPage">
    <div id="jitsi-container">
      <div class="loader-screen">
        <div class="spinner"></div>
        <div class="loading-title" id="joiningText">Joining room...</div>
      </div>
    </div>
  </div>

  <script>
    const scriptURL = "https://script.google.com/macros/s/AKfycby--FbH_De9SLlwwrE__4cjixi7M3pFNAR82n4Hu3ZqIGX4Vj2IHFhzgw2l66zCButD/exec";
    const HOME_URL = "https://rucsehub.netlify.app";
    const PREFIX = "RUCSEHUB";

    // Simple obfuscation
    function encryptRoom(room) {
      return btoa(room + "x9k2m").split("").reverse().join("");
    }
    function decryptRoom(hash) {
      try {
        return atob(hash.split("").reverse().join("")).replace(/x9k2m$/, "");
      } catch { return null; }
    }

    function getRealRoomName(displayName) {
      return PREFIX + displayName.replace(/\s+/g, '');
    }

    function saveUser(name, id, displayRoom) {
      localStorage.setItem("rucsehub_user", JSON.stringify({name, id, displayRoom, timestamp: Date.now()}));
    }
    function getUser() {
      const data = localStorage.getItem("rucsehub_user");
      return data ? JSON.parse(data) : null;
    }

    function validate(id) {
      if (id.length !== 10) return {ok:false, m:"ID must be 10 digits"};
      if (!/^\d+$/.test(id)) return {ok:false, m:"Only numbers"};
      if (id[5]!=='7' || id[6]!=='6') return {ok:false, m:"Only RU CSE students allowed"};
      return {ok:true, m:"Welcome CSE Family!"};
    }

    // Detect encrypted room from URL (?r=xxx)
    const urlParams = new URLSearchParams(location.search);
    const encrypted = urlParams.get("r");
    let currentDisplayRoom = "";

    if (encrypted) {
      currentDisplayRoom = decryptRoom(encrypted) || "";
      if (currentDisplayRoom) {
        document.getElementById("hiddenRoomInput").value = currentDisplayRoom;
        const saved = getUser();
        if (saved && saved.displayRoom === currentDisplayRoom) {
          document.getElementById("autoJoinMsg").style.display = "block";
          setTimeout(() => {
            const form = document.getElementById("joinForm");
            form.name.value = saved.name;
            form.id.value = saved.id;
            joinRoom(saved.name, saved.id, currentDisplayRoom);
          }, 2000);
        }
      }
    }

    // Real-time ID validation
    document.querySelectorAll('input[name="id"]').forEach(inp => {
      inp.addEventListener('input', e => {
        const msg = e.target.closest('form').querySelector('.msg');
        if (e.target.value.length === 10) {
          const v = validate(e.target.value);
          msg.textContent = v.m;
          msg.style.color = v.ok ? "#34d399" : "#f87171";
        } else msg.textContent = "";
      });
    });

    // Create Room
    document.getElementById("createForm").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const id = e.target.id.value.trim();
      const displayRoom = e.target.room.value.trim().replace(/\s+/g, '');

      if (!name || !id || !displayRoom) return alert("Fill all fields");
      const v = validate(id);
      if (!v.ok) return alert(v.m);

      const encryptedHash = encryptRoom(displayRoom);
      const shareLink = `${location.origin}${location.pathname}?r=${encryptedHash}`;

      document.getElementById("createdLink").textContent = shareLink;
      document.getElementById("createdLink").style.display = "block";
      document.getElementById("copyBtn").style.display = "inline-block";
      document.getElementById("joinAfterCreate").style.display = "inline-block";
      document.getElementById("createSuccess").style.display = "block";

      saveUser(name, id, displayRoom);
    };

    document.getElementById("joinAfterCreate").onclick = () => {
      const displayRoom = document.querySelector('#createForm input[name="room"]').value.trim().replace(/\s+/g, '');
      const name = document.querySelector('#createForm input[name="name"]').value.trim();
      const id = document.querySelector('#createForm input[name="id"]').value.trim();
      joinRoom(name, id, displayRoom);
    };

    // Join Form Submit
    document.getElementById("joinForm").onsubmit = e => {
      e.preventDefault();
      const name = e.target.name.value.trim();
      const id = e.target.id.value.trim();
      const displayRoom = document.getElementById("hiddenRoomInput").value;

      if (!displayRoom) {
        alert("Invalid or missing room link!");
        return;
      }

      const v = validate(id);
      if (!v.ok) return alert(v.m);

      saveUser(name, id, displayRoom);
      joinRoom(name, id, displayRoom);
    };

    function joinRoom(name, id, displayRoom) {
      const realRoom = getRealRoomName(displayRoom);

      fetch(scriptURL, { method:'POST', body:JSON.stringify({name, id, room: realRoom}) })
      .then(r => r.json())
      .then(res => {
        if (res.status === "success") {
          document.getElementById("joiningText").textContent = `${name} is joining...`;
          document.getElementById("homePage").style.display = "none";
          document.querySelector("header").style.display = "none";
          document.querySelector("footer").style.display = "none";
          document.getElementById("meetingPage").style.display = "block";

          const fullName = `${name} (${id})`;
          const api = new JitsiMeetExternalAPI("jitsi.riot.im", {
            roomName: realRoom,
            parentNode: document.getElementById("jitsi-container"),
            userInfo: { displayName: fullName },
            configOverwrite: { prejoinPageEnabled: false },
            interfaceConfigOverwrite: {
              SHOW_JITSI_WATERMARK: false,
              SHOW_BRAND_WATERMARK: false,
              SHOW_POWERED_BY: false
            },
            onload: () => {
              setTimeout(() => {
                document.querySelector(".loader-screen").style.opacity = "0";
                setTimeout(() => document.querySelector(".loader-screen").style.display = "none", 600);
              }, 800);
            }
          });

          api.addEventListener("readyToClose", () => {
            window.location.href = HOME_URL;
          });
        }
      })
      .catch(() => alert("Network error. Try again."));
    }

    function copyLink() {
      navigator.clipboard.writeText(document.getElementById("createdLink").textContent);
      document.getElementById("copyBtn").textContent = "Copied!";
      setTimeout(() => document.getElementById("copyBtn").textContent = "Copy Secure Link", 2000);
    }
  </script>

  <script src="https://jitsi.riot.im/external_api.js"></script>
</body>
</html>
