<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RUCSEHUB Meet - Powered by RUCSEHUB Mobile App</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    

    <!-- Jitsi External API -->
    <script src="https://8x8.vc/vpaas-magic-cookie-c6f623b736374f419f0abea7115f92d5/external_api.js"></script>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark px-3">
      <a class="navbar-brand text-white" href="#">
        <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo" />
        RUCSEHUB Meet
      </a>
    </nav>

    <!-- User Form -->
    <div id="user-form">
      <div class="login-container">
        <div class="login-left">
          <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo" />
          <h2>Welcome to RUCSEHUB Meet</h2>
          <p>Join your virtual classroom and collaborate with fellow students and faculty members in real-time.</p>
          
          <!-- Home and About Buttons - Now below the text -->
          <div class="left-buttons">
            <button class="btn-red" id="homeBtn">
              <i class="bi bi-house-fill me-1"></i> Home
            </button>
            <button class="btn-red" id="aboutBtn">
              <i class="bi bi-info-circle-fill me-1"></i> About
            </button>
          </div>
        </div>
        <div class="login-right">
          <div class="login-form">
            <h3>Enter Your Details</h3>
            <form id="meetingForm">
              <div class="mb-4">
                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="name"
                  placeholder="Enter your Name"
                  required
                />
              </div>
              <div class="mb-4">
                <input
                  type="text"
                  class="form-control form-control-lg"
                  name="id"
                  placeholder="Enter your Student ID"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
                <span id="submitText">Join Meeting</span>
                <div id="submitSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </button>
            </form>
            <p id="message"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- Jitsi Meeting Area -->
    <div id="jaas-container"></div>

    <!-- Footer -->
    <footer>
      <img src="https://i.postimg.cc/pX3xdJHr/image.png" alt="RUCSEHUB Logo">
      © 2025 RUCSEHUB | Powered by <b>RUCSEHUB Mobile App</b> · Made with 💙
      for CSE Students
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="scripts.js"></script>
      <script src="css_to_js.js"></script>
  </body>
</html>
